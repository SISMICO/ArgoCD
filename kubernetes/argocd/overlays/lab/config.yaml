apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: http://argocd.localhost:8080
  admin.enabled: "true"
  timeout.reconciliation: 60s
  timeout.reconciliation.jitter: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  # HTTP is confined to loopback on the lab host.
  server.insecure: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  policy.default: role:readonly

