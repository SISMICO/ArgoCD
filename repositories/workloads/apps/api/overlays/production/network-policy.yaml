apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api
spec:
  podSelector:
    matchLabels:
      app: demo-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Change to the namespace hosting your production Traefik installation.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 5678
  # These demos need no outbound network access.
  egress: []
